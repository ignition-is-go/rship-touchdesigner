name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ci-public-linux-ephemeral
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources
        run: python3 -m compileall -q py
