name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ["self-hosted", "Linux", "X64", "ram-ge-16g", "disk-ge-100g"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources
        run: python3 -m compileall -q py
